{{define "base.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{if .Title}}{{.Title}} · {{end}}SeshHub</title>
    {{if .OGTitle}}
    <meta property="og:title" content="{{.OGTitle}}">
    <meta property="og:description" content="{{.OGDesc}}">
    {{if .OGImage}}<meta property="og:image" content="{{.OGImage}}">{{end}}
    {{end}}
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
    <link href="https://fonts.cdnfonts.com/css/pill-gothic-600mg" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/monster-chiller" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/turbo-jungle" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    {{if .Hero}}<script src="/static/js/hero.js" defer></script>{{end}}
    {{if .Monaco}}<script src="/static/js/editor.js" defer></script>{{end}}
</head>
<body>
    {{if .Hero}}
    <section class="hero">
        <button type="button" class="hero-play" aria-label="Play Sesh Sofa">
            <img src="/static/img/seshsofa.png" alt="">
        </button>
        <div class="hero-vid">
            <video controls preload="none">
                <source src="/static/vid/seshsofa.mp4" type="video/mp4">
            </video>
        </div>
        <button type="button" class="hero-close" hidden>Close</button>
    </section>
    {{end}}
    {{template "nav.html" .}}
    <main class="wrap">
        {{template "content" .}}
    </main>
    {{template "footer.html" .}}
</body>
</html>
{{end}}
