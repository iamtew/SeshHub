{{define "forum_mdbar"}}
<div class="forum-mdbar">
    <button type="button" class="forum-md" data-before="**" data-after="**" title="Bold"><b>B</b></button>
    <button type="button" class="forum-md" data-before="*" data-after="*" title="Italic"><i>I</i></button>
    <button type="button" class="forum-md" data-before="`" data-after="`" title="Code">&lt;/&gt;</button>
    <button type="button" class="forum-md" data-before="[" data-after="](url)" title="Link">Link</button>
    <button type="button" class="forum-md" data-before="> " data-after="" title="Quote">Quote</button>
</div>
{{end}}
{{define "forum_files"}}
<label class="gallery-drop forum-drop">
    Drop files here, or tap (15MB, max 3)
    <input type="file" name="photos" accept="image/jpeg,image/png,image/gif,image/webp,audio/mpeg,audio/wav,audio/ogg,audio/flac,audio/mp4,video/mp4,video/webm,video/ogg,application/pdf" multiple>
</label>
<p class="forum-drop-names who" hidden></p>
{{end}}
