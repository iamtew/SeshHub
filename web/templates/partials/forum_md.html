{{define "forum_mdbar"}}
<div class="forum-mdbar">
    <button type="button" class="forum-md" data-before="**" data-after="**" title="Bold" aria-label="Bold"><i class="fa-solid fa-bold" aria-hidden="true"></i></button>
    <button type="button" class="forum-md" data-before="*" data-after="*" title="Italic" aria-label="Italic"><i class="fa-solid fa-italic" aria-hidden="true"></i></button>
    <button type="button" class="forum-md" data-before="`" data-after="`" title="Code" aria-label="Code"><i class="fa-solid fa-code" aria-hidden="true"></i></button>
    <button type="button" class="forum-md" data-before="[" data-after="](url)" title="Link" aria-label="Link"><i class="fa-solid fa-link" aria-hidden="true"></i></button>
    <button type="button" class="forum-md" data-before="> " data-after="" title="Quote" aria-label="Quote"><i class="fa-solid fa-quote-left" aria-hidden="true"></i></button>
</div>
{{end}}
{{define "forum_files"}}
<label class="gallery-drop forum-drop">
    <span class="forum-drop-desk">Drop files here, or tap (15MB, max 3)</span>
    <span class="forum-drop-phone">Tap to add files (15MB, max 3)</span>
    <input type="file" name="photos" accept="image/*,audio/*,video/*,application/pdf" multiple>
</label>
<p class="forum-drop-names who" hidden></p>
{{end}}
