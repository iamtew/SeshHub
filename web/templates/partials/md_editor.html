{{define "md_toolbar"}}
<p class="md-toolbar"><button type="button" class="md-adv-btn"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> Advanced editor</button></p>
<dialog class="md-overlay" aria-label="Advanced markdown editor">
    <div class="md-overlay-bar">
        <button type="button" class="md-overlay-close"><i class="fa-solid fa-xmark" aria-hidden="true"></i> Close</button>
        <button type="button" class="md-overlay-save"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save</button>
    </div>
    <div class="md-overlay-body">
        <aside class="md-side"></aside>
        <div id="monaco-mount"></div>
        <div class="md-preview md-overlay-preview prose" aria-live="polite"></div>
    </div>
</dialog>
<script src="/static/js/editor.js" defer></script>
{{end}}

{{define "md_editor"}}
<div class="md-edit"{{if .Cfg}} data-fill="spot"{{end}}>
    <div class="md-basic">
        <div class="md-col">
            <span>Markdown</span>
            <textarea name="{{if .BioEdit}}bio{{else}}content_raw{{end}}" rows="16" {{if and (not .Cfg) (not .BioEdit)}}required{{end}}>{{if .A}}{{.A.ContentRaw}}{{else if .BioEdit}}{{.P.Bio}}{{else if .P}}{{.P.ContentRaw}}{{else if .Cfg}}{{.Cfg.ContentRaw}}{{end}}</textarea>
        </div>
        <div class="md-col">
            <span>Preview</span>
            <div class="md-preview prose" aria-live="polite"></div>
        </div>
    </div>
</div>
{{end}}

{{define "md_actions"}}
<div class="form-actions">
    <a class="btn md-discard" href="{{if .Cancel}}{{.Cancel}}{{else}}{{.Path}}{{end}}"><i class="fa-solid fa-xmark" aria-hidden="true"></i> Discard and close</a>
    <button type="submit" name="after" value="stay"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save</button>
    <button type="submit" name="after" value="close"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save and close</button>
</div>
{{end}}
