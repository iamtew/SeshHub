{{define "nav.html"}}
<header class="nav">
    <a class="brand" href="/">Sesh Sofa</a>
    <input id="nav-toggle" class="nav-toggle" type="checkbox">
    <label class="nav-burger" for="nav-toggle">Menu</label>
    <nav>
        <a href="/" {{if eq .Path "/"}}aria-current="page"{{end}}>Spot</a>
        <a href="/team" {{if eq .Path "/team"}}aria-current="page"{{end}}>Team</a>
        <a href="/news" {{if eq .Path "/news"}}aria-current="page"{{end}}>News</a>
        <a href="/videos" {{if eq .Path "/videos"}}aria-current="page"{{end}}>Videos</a>
    </nav>
    {{if not .User}}
    <div class="signin">
        <a class="hub-btn" href="/login" aria-label="Sesh Hub"><img src="/static/img/seshhub-square.png" alt=""></a>
    </div>
    {{end}}
</header>
{{end}}
