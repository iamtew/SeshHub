{{define "nav.html"}}
<header class="nav">
    <a class="brand" href="/">Sesh Sofa</a>
    <nav>
        <a href="/" {{if eq .Path "/"}}aria-current="page"{{end}}>Home</a>
        <a href="/team" {{if eq .Path "/team"}}aria-current="page"{{end}}>Team</a>
        <a href="/news" {{if eq .Path "/news"}}aria-current="page"{{end}}>News</a>
        <a href="/videos" {{if eq .Path "/videos"}}aria-current="page"{{end}}>Videos</a>
    </nav>
    <div class="signin">
        {{if .User}}
            {{if eq .User.Role "pending"}}<a href="/access" {{if eq .Path "/access"}}aria-current="page"{{end}}>Access</a>{{end}}
            {{if eq .User.Role "admin"}}<a href="/admin/access" {{if eq .Path "/admin/access"}}aria-current="page"{{end}}>Queue</a>{{end}}
            <span class="who">{{.User.DisplayName}}</span>
            <a href="/auth/logout">Log out</a>
        {{else}}
            {{if .DiscordLogin}}<a class="btn" href="/auth/discord">Discord</a>{{else}}<button type="button" disabled title="OAuth not configured">Discord</button>{{end}}
            {{if .YouTubeLogin}}<a class="btn" href="/auth/youtube">YouTube</a>{{else}}<button type="button" disabled title="OAuth not configured">YouTube</button>{{end}}
        {{end}}
    </div>
</header>
{{end}}
