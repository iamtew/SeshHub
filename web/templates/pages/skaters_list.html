{{define "content"}}
<h1>{{.Title}}</h1>
{{if not .Skaters}}
<p>Nobody here yet.</p>
{{else}}
<ul class="grid">
{{range .Skaters}}
<li>
    <div class="profile-head profile-head--list">
        {{if .AvatarURL}}<img class="avatar {{.AvatarClass}}" src="{{.AvatarURL}}" alt="" referrerpolicy="no-referrer" style="{{.AvatarStyle}}">{{end}}
        <div>
            <a href="{{$.Path}}/{{.Slug}}"><strong>{{.PublicName}}</strong></a>
            <span class="who">{{.Stance}} · {{.Status}}{{if .Location}} · {{.Location}}{{end}}</span>
        </div>
    </div>
</li>
{{end}}
</ul>
{{end}}
{{end}}
