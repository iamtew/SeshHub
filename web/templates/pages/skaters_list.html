{{define "content"}}
<h1>{{.Title}}</h1>
{{if not .Skaters}}
<p>Nobody here yet.</p>
{{else}}
<ul class="grid">
{{range .Skaters}}
<li>
    <a href="{{$.Path}}/{{.Slug}}" class="profile-head profile-head--list">
        {{if .AvatarURL}}<span class="avframe {{.AvatarClass}}" style="{{.AvatarStyle}}"><img class="avatar" src="{{.AvatarURL}}" alt="" referrerpolicy="no-referrer"></span>{{end}}
        <div>
            <strong>{{.PublicName}}</strong>
            <span class="who">{{.Stance}} · {{.Status}}{{if .Location}} · {{.Location}}{{end}}</span>
        </div>
    </a>
</li>
{{end}}
</ul>
{{end}}
{{end}}
