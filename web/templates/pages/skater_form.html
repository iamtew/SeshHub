{{define "content"}}
<h1>{{.Title}}</h1>
<form method="post" action="{{.Action}}" class="form">
    <p>Name {{.P.SkaterName}}</p>
    <label>Display name <input name="display_name" value="{{.P.RealName}}" placeholder="optional"></label>
    <label>Location <input name="location" value="{{.P.Location}}"></label>
    <label>Stance
        <select name="stance">
            <option value="regular" {{if eq .P.Stance "regular"}}selected{{end}}>Regular</option>
            <option value="goofy" {{if eq .P.Stance "goofy"}}selected{{end}}>Goofy</option>
            <option value="mongo" {{if eq .P.Stance "mongo"}}selected{{end}}>Mongo</option>
        </select>
    </label>
    <label>Bio <textarea name="bio" rows="4">{{.P.Bio}}</textarea></label>
    {{if .Videos}}
    <label>Featured video
        <select name="featured_video_id">
            <option value="">None</option>
            {{range .Videos}}
            <option value="{{.ID}}" {{if eq $.P.FeaturedVideoID .ID}}selected{{end}}>{{.Title}}</option>
            {{end}}
        </select>
    </label>
    {{end}}
    <button type="submit">Save</button>
</form>
{{end}}
