{{define "content"}}
<h1>News</h1>
{{if not .Articles}}
<p>No articles yet.</p>
{{else}}
{{range .Articles}}
<article class="prose">
    {{if .ImageURL}}<img src="{{.ImageURL}}" alt="" class="banner">{{end}}
    <h2><a href="/news/{{.Slug}}">{{.Title}}</a></h2>
    <p class="who">{{.AuthorName}}{{if .PublishedAt}} · {{.PublishedAt}}{{end}}</p>
    {{.HTML}}
</article>
{{end}}
{{template "pager.html" .}}
{{end}}
{{end}}
