{{define "content"}}
<h1>Pages</h1>
<p><a class="btn" href="/admin/pages/new">New page</a></p>
{{if not .Pages}}
<p>None yet.</p>
{{else}}
<ul class="queue">
{{range .Pages}}
<li>
    <a href="/{{.Slug}}">{{.Title}}</a>
    <span class="who">{{if .Published}}published{{else}}draft{{end}}</span>
    <a class="btn" href="/admin/pages/{{.ID}}">Edit</a>
    {{if ne .ID "page-team"}}<form method="post" action="/admin/pages/{{.ID}}/delete"><button type="submit">Delete</button></form>{{end}}
</li>
{{end}}
</ul>
{{end}}
{{end}}
