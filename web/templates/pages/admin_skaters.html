{{define "content"}}
<h1>FS Team</h1>
{{if .Skaters}}
<ul class="queue">
{{range .Skaters}}
<li>
    <a href="{{if eq .Role "friend"}}/friends/{{else}}/team/{{end}}{{.Slug}}">{{.PublicName}}</a>
    <form method="post" action="/admin/skaters/{{.ID}}">
        <label>Status
            <select name="status">
                <option value="active" {{if eq .Status "active"}}selected{{end}}>Active</option>
                <option value="pro" {{if eq .Status "pro"}}selected{{end}}>Pro</option>
                <option value="am" {{if eq .Status "am"}}selected{{end}}>Am</option>
                <option value="flow" {{if eq .Status "flow"}}selected{{end}}>Flow</option>
                <option value="legend" {{if eq .Status "legend"}}selected{{end}}>Legend</option>
                <option value="inactive" {{if eq .Status "inactive"}}selected{{end}}>Inactive</option>
            </select>
        </label>
        <button type="submit">Save</button>
    </form>
    <form method="post" action="/admin/skaters/{{.ID}}/delete"><button type="submit">Delete</button></form>
</li>
{{end}}
</ul>
{{else}}
<p>No profiles yet. They appear when someone with the Discord skater role logs in.</p>
{{end}}
{{end}}
