{{define "content"}}
<h1>Videos</h1>
{{if not .Videos}}
<p>No videos yet.</p>
{{else}}
<ul class="grid">
{{range .Videos}}
<li>
    <a href="https://www.youtube.com/watch?v={{.ID}}">
        {{if .Thumb}}<img src="{{.Thumb}}" alt="" class="thumb">{{end}}
        <strong>{{.Title}}</strong>
    </a>
    {{if .StatsLine}}<span class="who">{{.StatsLine}}</span>{{end}}
</li>
{{end}}
</ul>
{{template "pager.html" .}}
{{end}}
{{end}}
