{{define "content"}}
<h1>{{.Title}}</h1>
{{template "md_toolbar" .}}
<form method="post" action="{{.Action}}" class="form">
    <input type="hidden" name="id" value="{{.P.ID}}">
    {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
    <div data-md-meta>
        <label>Title <input name="title" required value="{{.P.Title}}"></label>
        <label>Slug <input name="slug" value="{{.P.Slug}}" placeholder="auto" {{if .P.IsLocked}}readonly{{end}}></label>
        <label><input type="checkbox" name="published" value="1" {{if .P.Published}}checked{{end}}> Published</label>
        <label>Visibility
            <select name="visibility">
                <option value="public" {{if ne .P.Visibility "internal"}}selected{{end}}>Public</option>
                <option value="internal" {{if eq .P.Visibility "internal"}}selected{{end}}>Internal</option>
            </select>
        </label>
    </div>
    {{template "md_editor" .}}
    <details class="md-css">
        <summary>Custom CSS</summary>
        <textarea name="custom_css" rows="6">{{.P.CSS}}</textarea>
    </details>
    {{template "md_actions" .}}
</form>
{{end}}
