{{define "content"}}
<h1>{{.Title}}</h1>
<form method="post" action="{{.Action}}" class="form">
    <input type="hidden" name="id" value="{{.P.ID}}">
    <label>Title <input name="title" required value="{{.P.Title}}"></label>
    <label>Slug <input name="slug" value="{{.P.Slug}}" placeholder="auto"></label>
    <label><input type="checkbox" name="published" value="1" {{if .P.Published}}checked{{end}}> Published</label>
    <label>Custom CSS <textarea name="custom_css" rows="3">{{.P.CSS}}</textarea></label>
    <label>Markdown <textarea name="content_raw" rows="16" required>{{.P.ContentRaw}}</textarea></label>
    <button type="submit">Save</button>
</form>
{{end}}
